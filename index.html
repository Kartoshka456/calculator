<style>

  .eq-row button { width: 118px; height: 50px; font-size: 20px; border-color: #aaa; }
  #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 100; align-items: center; justify-content: center; }
  #overlay.show { display: flex; }
  #overlay video { max-width: 90vw; max-height: 90vh; border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,0.7); }

  </div>

</div>

<script>
  let expr = '', fresh = true;
  const display = document.getElementById('display');
  function press(val) {
    if (fresh && !isNaN(val)) { expr = ''; fresh = false; }
    if (fresh && val === '.') { expr = '0'; fresh = false; }
    if (fresh) fresh = false;
    expr += val; display.value = expr;
  }
  function clearCalc() { expr = ''; display.value = '0'; fresh = true; }
  function calculate() {
    try {
      let r = Function('"use strict"; return (' + expr + ')')();
      if (!isFinite(r)) { display.value = 'Ошибка'; expr = ''; fresh = true; return; }
      r = parseFloat(r.toFixed(10));
      display.value = r; expr = String(r); fresh = true;
    } catch(e) { display.value = 'Ошибка'; expr = ''; fresh = true; }
    openOverlay();
  }
  const overlay = document.getElementById('overlay');
  const video = document.getElementById('my-video');
  function openOverlay() {
    overlay.classList.add('show');
    video.currentTime = 0;
    video.play();
  }
</script>
